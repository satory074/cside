[project]
name = "cside"
version = "2.0.0"
description = "Cover Song IDEntification — 2026 remake with MuQ embeddings and FAISS retrieval"
requires-python = ">=3.12"
dependencies = [
    # Audio processing
    "librosa>=0.11.0",
    "torchaudio>=2.0.0",
    "pedalboard>=0.9.0",
    # Deep learning
    "torch>=2.0.0",
    "transformers>=4.40.0",
    # Fast similarity search
    "faiss-cpu>=1.8.0",
    # Data handling
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    # MIR datasets & evaluation
    "mirdata>=0.3.9",
    "mir_eval>=0.7.0",
    # Serialization & utilities
    "tqdm>=4.66.0",
    "h5py>=3.11.0",
    "pydantic>=2.7.0",
    "click>=8.1.0",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
]
web = [
    "gradio>=4.40.0",
    "matplotlib>=3.9.0",
    "Pillow>=10.0.0",
]
# gpu = ["faiss-gpu"]  # No Python 3.12 wheels available; install manually if needed

[project.scripts]
cside-extract   = "cside.scripts.extract_features:main"
cside-index     = "cside.scripts.build_index:main"
cside-identify  = "cside.scripts.identify_covers:main"
cside-medley    = "cside.scripts.detect_medley:main"
cside-evaluate  = "cside.scripts.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cside"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
